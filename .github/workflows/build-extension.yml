name: Build Chrome Extension

on:
  push:
    branches:
      - main
    paths:
      - 'apps/extension/**'
      - '.github/workflows/build-extension.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/extension

jobs:
  build:
    name: Build & package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Zip extension
        run: |
          cd dist
          zip -r "../navidrome-player-extension-${{ steps.version.outputs.version }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: navidrome-player-extension-${{ steps.version.outputs.version }}
          path: apps/extension/navidrome-player-extension-${{ steps.version.outputs.version }}.zip
          retention-days: 90
